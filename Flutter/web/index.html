<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Instaprop - Real Estate Auctions">

  <!-- Google Sign-In -->
  <meta name="google-signin-client_id" content="278402764609-6lgm1herr8pjljb94fcmv6ea25fjeqe0.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Instaprop">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Instaprop</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- TEST: If you see this message, the HTML is loading! -->
  <div id="loading-test" style="position: fixed; top: 0; left: 0; width: 100%; background: #4CAF50; color: white; padding: 10px; text-align: center; z-index: 9999; font-family: Arial, sans-serif;">
    ✅ Flutter HTML is loading! Base href: <span id="base-href-display"></span>
  </div>
  <script>
    // Display the actual base href being used
    document.getElementById('base-href-display').textContent = document.querySelector('base')?.href || 'NOT SET';
    // Hide the test message after 3 seconds
    setTimeout(() => {
      const testDiv = document.getElementById('loading-test');
      if (testDiv) testDiv.style.display = 'none';
    }, 3000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
